name: deploy

on:
  workflow_run:
    workflows: [release]
    types: [completed]

permissions:
  contents: read
  actions: read
  id-token: write

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-tags: true

      # workflow_run doesn't expose the triggering run's job outputs directly,
      # so the release version tag is fetched from the git tag on the same
      # commit instead (release.yml always tags vX.Y.Z before building).
      #
      # A missing tag is not an error here: go-semantic-release legitimately
      # creates no tag (and release.yml's release-binary/release-image jobs
      # skip) when the commits since the last release don't warrant a
      # version bump, e.g. a docs-only change. release.yml still reports
      # success in that case, which is what triggers this workflow - so
      # treat "no tag" as "nothing to deploy" and exit 0, not exit 1.
      - name: Resolve release version
        id: version
        run: |
          tag=$(git tag --points-at "${{ github.event.workflow_run.head_sha }}" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1)
          if [ -z "$tag" ]; then
            echo "No release tag found on ${{ github.event.workflow_run.head_sha }}, nothing to deploy."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Authenticate to GCP via Workload Identity Federation
        if: steps.version.outputs.found == 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        if: steps.version.outputs.found == 'true'
        uses: google-github-actions/setup-gcloud@v3

      # Infrastructure is NOT applied here. The CI/CD identity, its IAM roles,
      # WIF, and the Artifact Registry repo are one-time setup done by hand
      # via `gcloud` (see docs/CLOUD_RUN_CICD_BOOTSTRAP.md). The Cloud Run
      # service itself is managed by Terraform in infra/, applied manually
      # (`terraform apply`, run by a human) - not by CI, and not via
      # Infrastructure Manager. This workflow only updates the running
      # image on an already-existing service.
      #
      # Terraform's Cloud Run resource ignores `image` changes after create
      # (see infra/cloud_run.tf) so each release's image is deployed here
      # instead - a plain revision update, not a Terraform-managed field.
      - name: Deploy image to Cloud Run
        if: steps.version.outputs.found == 'true'
        run: |
          gcloud run deploy notes-app \
            --project=${{ secrets.GCP_PROJECT_ID }} \
            --region=${{ secrets.GCP_REGION }} \
            --image=${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/notes-app/notes-app:${{ steps.version.outputs.version }}
